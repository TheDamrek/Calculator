<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div class="buttonContainer">
        <button class="OrangeSign">C</button>
        <button class="OrangeSign"><i class="ri-delete-back-2-line"></i></button>
        <button class="OrangeSign"><i class="ri-percent-line"></i></button>
        <button class="OrangeSign"><i class="ri-divide-line"></i></button>
        <button class="White">7</button>
        <button class="White">8</button>
        <button class="White">9</button>
        <button class="OrangeSign"><i class="ri-close-line"></i></button>
        <button class="White">4</button>
        <button class="White">5</button>
        <button class="White">6</button>
        <button class="OrangeSign"><i class="ri-subtract-line"></i></button>
        <button class="White">1</button>
        <button class="White">2</button>
        <button class="White">3</button>
        <button class="OrangeSign"><i class="ri-add-fill"></i></button>
        <button class="OrangeSign"><i class="ri-expand-height-line"></i></button>
        <button class="White">0</button>
        <button class="White">.</button>
        <button class="Orange"><i class="ri-equal-line"></i></button>
    </div>

    <div class="OperationsBox">
        <div readonly class="BasicText">  <span>Y</span><span>o</span><span>u</span><span>r</span>&nbsp;<span>o</span><span>p</span><span>e</span><span>r</span><span>a</span><span>t</span><span>i</span><span>o</span><span>n</span><span>s</span>&nbsp;<span>w</span><span>i</span><span>l</span><span>l</span>&nbsp;<span>b</span><span>e</span>&nbsp;<span>d</span><span>i</span><span>s</span><span>p</span><span>l</span><span>a</span><span>y</span><span>e</span><span>d</span>&nbsp;<span>h</span><span>e</span><span>r</span><span>e</span></div>
    </div>
</body>
<script src="Calculator.js"></script>
</html>
