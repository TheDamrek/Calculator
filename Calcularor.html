<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
<div class="buttonContainer">
    <button>C</button>
    <button> <i class='bx bx-backspace'></i></button>
    <button> <i class='bx bx-percentage'></i></button>
    <button> <i class='bx bx-division'></i></button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button> <i class='bx bx-x'></i></button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button> <i class='bx bx-minus'></i></button>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button> <i class='bx bx-plus'></i></button>
    <button> <i class='bx bx-'></i></button>
    <button>0</button>
    <button>.</button>
    <button> <i class='bx bx-arrow-up-left-circle'></i></button>
</div>  
</body>
<script src="Calculator.js"></script>
</html>
