<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
<div class="buttonContainer">
    <button class="OrangeSign">C</button>
    <button class="OrangeSign" > <i class='bx bx-backspace'></i></button>
    <button class="OrangeSign"> <i class='bx bx-percentage'></i></button>
    <button class="OrangeSign"> <i class='bx bx-division'></i></button>
    <button class="White">7</button>
    <button class="White">8</button>
    <button class="White">9</button>
    <button class="OrangeSign"> <i class='bx bx-x'></i></button>
    <button class="White">4</button>
    <button class="White">5</button>
    <button class="White">6</button>
    <button class="OrangeSign"> <i class='bx bx-minus'></i></button>
    <button class="White">1</button>
    <button class="White">2</button>
    <button class="White">3</button>
    <button class="OrangeSign"> <i class='bx bx-plus'></i></button>
    <button class="Orange"> <i class='bx bx-equal'></i></button>
    <button class="White">0</button>
    <button class="White">.</button>
    <button class="OrangeSign"> <i class='bx bx-arrow-up-left-circle'></i></button>
</div>  
</body>
<script src="Calculator.js"></script>
</html>
